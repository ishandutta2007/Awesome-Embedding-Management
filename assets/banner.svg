<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 350"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/><stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes float-slow{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(1deg)}}@keyframes float-reverse{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(12px) rotate(-1deg)}}@keyframes pulse-glow{0%{opacity:.3;transform:scale(.98)}50%{opacity:.7;transform:scale(1.02)}}.badge-text,.subtitle,.title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:46px;fill:#fff}.subtitle{font-weight:400;font-size:20px;fill:#cbd5e1}.badge-text{font-weight:600;font-size:13px;fill:#f8fafc}.animated-bg-1{animation:pulse-glow 6s ease-in-out infinite;transform-origin:300px 150px}.animated-bg-2{animation:pulse-glow 8s ease-in-out infinite 1s;transform-origin:900px 200px}.floating-node-1{animation:float-slow 7s ease-in-out infinite}.floating-node-2{animation:float-reverse 9s ease-in-out infinite}.pulse-line{stroke-dasharray:8 8;animation:dash 3s linear infinite}</style></defs><rect width="1200" height="350" fill="url(#bg-grad)" rx="16"/><circle cx="250" cy="120" r="180" fill="#6366f1" class="animated-bg-1" filter="url(#glow)" opacity=".25"/><circle cx="950" cy="220" r="200" fill="#d946ef" class="animated-bg-2" filter="url(#glow)" opacity=".2"/><g opacity=".25"><line x1="100" x2="300" y1="280" y2="290" stroke="#818cf8" stroke-width="2" class="pulse-line"/><line x1="300" x2="500" y1="290" y2="270" stroke="#818cf8" stroke-width="2"/><line x1="500" x2="700" y1="270" y2="300" stroke="#c084fc" stroke-width="2" class="pulse-line"/><line x1="700" x2="950" y1="300" y2="280" stroke="#c084fc" stroke-width="2"/><line x1="950" x2="1100" y1="280" y2="310" stroke="#f472b6" stroke-width="2"/><circle cx="100" cy="280" r="6" fill="#818cf8"/><circle cx="300" cy="290" r="8" fill="#818cf8"/><circle cx="500" cy="270" r="5" fill="#c084fc"/><circle cx="700" cy="300" r="9" fill="#c084fc"/><circle cx="950" cy="280" r="7" fill="#f472b6"/><circle cx="1100" cy="310" r="6" fill="#f472b6"/></g><g class="floating-node-1" opacity=".4"><rect width="180" height="50" x="80" y="40" fill="url(#card-grad)" stroke="rgba(255,255,255,0.15)" stroke-width="1" rx="10"/><text x="100" y="70" fill="#a5b4fc" class="badge-text">⚡ 8K Context Embeddings</text></g><g class="floating-node-2" opacity=".4"><rect width="190" height="50" x="940" y="45" fill="url(#card-grad)" stroke="rgba(255,255,255,0.15)" stroke-width="1" rx="10"/><text x="960" y="75" fill="#f472b6" class="badge-text">🔍 HNSW Vector Indexes</text></g><g text-anchor="middle" transform="translate(600, 145)"><rect width="280" height="32" x="-140" y="-85" fill="url(#accent-grad)" rx="16"/><text x="0" y="-64" class="badge-text" letter-spacing="1" text-anchor="middle">AWESOME ECOSYSTEM LIST</text><text x="0" y="0" class="title" filter="url(#glow)">Awesome Embedding Management 🚀</text><text x="0" y="42" class="subtitle">Curated SaaS Platforms &amp; Open-Source Infrastructure for RAG, Vector Search &amp; Embeddings</text><g transform="translate(0, 85)"><rect width="170" height="34" x="-290" y="0" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1" rx="8"/><text x="-205" y="22" class="badge-text" text-anchor="middle">⚡ Vector Databases</text><rect width="200" height="34" x="-100" y="0" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1" rx="8"/><text x="0" y="22" class="badge-text" text-anchor="middle">🤖 RAG &amp; Chunking Pipelines</text><rect width="170" height="34" x="120" y="0" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1" rx="8"/><text x="205" y="22" class="badge-text" text-anchor="middle">📊 Semantic Search</text></g></g><rect width="1200" height="6" x="0" y="344" fill="url(#accent-grad)"/></svg>